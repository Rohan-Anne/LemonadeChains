{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="lc-auth-container">
    <div class="lc-auth-card text-center">
      <h1>Login</h1>
      <form action="/signin" method="post">
        <div class="form-group mb-4">
          <label for="email">Email</label>
          <input type="email" class="lc-form-control" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group mb-4">
          <label for="password">Password</label>
          <input type="password" class="lc-form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="lc-btn-primary" style="width: 100%;">Sign In</button>
      </form>

      <div class="lc-divider">
        <span>or</span>
      </div>

      <div class="text-center">
        <a href="/google-login" class="lc-btn-google" style="width: 100%;"><i class="fab fa-google"></i> Sign in with Google</a>
      </div>

      <div class="lc-auth-footer">
        <p>Don't have an account? <a href="/signup">Sign up here</a></p>
      </div>
    </div>
  </div>
{% endblock %}
