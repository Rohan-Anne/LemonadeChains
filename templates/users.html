{% extends 'base.html' %}

{% block title %}Users{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem;">Users</h2>
  <table class="lc-table">
    <thead>
      <tr>
        <th>Email</th>
        <th>UID</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.email }}</td>
        <td>{{ user.uid }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
