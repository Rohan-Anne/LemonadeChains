{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
  <div class="lc-auth-container">
    <div class="lc-auth-card text-center">
      <h2>Create Your Account</h2>
      <form method="POST" action="{{ url_for('signup') }}">
        <div class="form-group mb-4">
          <input type="email" class="lc-form-control" name="email" placeholder="Email" required>
        </div>
        <div class="form-group mb-4">
          <input type="text" class="lc-form-control" id="name" name="name" placeholder="Full Name" required>
        </div>
        <div class="form-group mb-4">
          <input type="password" class="lc-form-control" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="lc-btn-primary" style="width: 100%;">Sign Up</button>
      </form>

      <div class="lc-divider">
        <span>or</span>
      </div>

      <div class="text-center">
        <a href="/google-login" class="lc-btn-google" style="width: 100%;"><i class="fab fa-google"></i> Sign up with Google</a>
      </div>

      <div class="lc-auth-footer">
        <p>Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
      </div>
    </div>
  </div>
{% endblock %}
